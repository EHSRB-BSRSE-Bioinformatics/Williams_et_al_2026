[workspace]
authors = ["mattjmeier <matthew.james.meier@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "FDR_code"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "Rscript scripts/check_setup.R"
figures = { depends-on = [
    "publication-summary-figures",
    "sample-figures",
    "legacy-figures",
    { task = "dmso-pca", environment = "deg" },
    "threshold-figures",
    "tgx-signature-figure",
] }
publication-summary-figures = { cmd = "Rscript scripts/render_figures.R --publication", depends-on = ["check"] }
exploratory-figures = { depends-on = ["summary-figures", "threshold-drafts", "filter-burden-figure", "filter-medians-figure"] }
summary-figures = { cmd = "Rscript scripts/render_figures.R", depends-on = ["check"] }
sample-data = "Rscript scripts/rebuild_sample_supplementary_data.R"
sample-figures = "Rscript scripts/render_sample_supplementary_figures.R"
sample-check = "Rscript tests/test_sample_supplementary_figures.R"
legacy-data = "Rscript scripts/rebuild_legacy_supplementary_data.R"
legacy-figures = "Rscript scripts/render_legacy_supplementary_figures.R"
legacy-check = "Rscript tests/test_legacy_supplementary_figures.R"
threshold-figures = "Rscript scripts/deg_thresholds/plot_threshold_sensitivity.R"
threshold-drafts = "Rscript scripts/deg_thresholds/plot_threshold_sensitivity.R --include-drafts"
tgx-signature-figure = "Rscript scripts/tgx_signature/render_figure.R"
filter-burden-figure = "Rscript scripts/deg_thresholds/plot_filter_burden.R"
filter-medians-figure = "Rscript scripts/deg_thresholds/plot_filter_medians.R"
figure-check = "Rscript tests/test_figure_registry.R"
trial-metadata = "Rscript scripts/01_make_trial_metadata.R"
rebuild-gsea = "Rscript scripts/rebuild_gsea_summary.R"
rebuild-summaries = "Rscript scripts/rebuild_summaries_from_large_outputs.R"
s8-data = "Rscript scripts/rebuild_s8_figure_data.R"
s8-figure = { cmd = "Rscript scripts/render_figures.R --only=s8_mean_variance", depends-on = ["check"] }
s56-data = "Rscript scripts/rebuild_s56_figure_data.R"
s56-figures = { cmd = "Rscript scripts/render_figures.R --only=s5_recurrence,s6_expression", depends-on = ["s56-check"] }
s56-check = "Rscript tests/test_s56_figures.R"

[dependencies]
r-base = ">=4.5.3,<4.6"
r-tidyr = ">=1.3.2,<2"
r-dplyr = ">=1.2.1,<2"
r-patchwork = ">=1.3.2,<2"
r-ggplot2 = ">=4.0.3,<5"
r-ggridges = ">=0.5.7,<0.6"
r-viridis = ">=0.6.5,<0.7"
r-cairo = ">=1.7_0,<2"

[feature.deg.dependencies]
bioconductor-deseq2 = "*"
bioconductor-edger = "*"
r-ashr = "*"

[feature.deg.tasks]
dmso-pca = "Rscript scripts/render_dmso_pca.R"

[feature.deg-study.tasks]
deg-validate = "Rscript scripts/validate_deg_reference.R --strict-numerics false"
deg-example = "Rscript scripts/run_deg_trials.R --trial-ids data/reference/deg_reference_trials.tsv --output-dir data/large/deg_example --cores 1"

[feature.deg-study.dependencies]
r-base = ">=4.2,<4.3"
bioconductor-deseq2 = "1.38.0.*"
bioconductor-edger = "3.40.0.*"
r-ashr = "2.2_54.*"

[environments]
default = { solve-group = "default" }
deg = { features = ["deg"], solve-group = "default" }
deg-study = { features = ["deg-study"], no-default-feature = true }
